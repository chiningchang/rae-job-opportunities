name: RAE browser QA and posting PDF capture
on:
  push:
    paths:
      - '.github/workflows/rae-browser-qa.yml'
  workflow_dispatch:
  schedule:
    # Run after the 2 AM Eastern release: 3 AM EST / 4 AM EDT (07:00 UTC).
    - cron: '0 7 * * 2,5'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture original posting pages and QA published website
        run: |
          mkdir -p rae-qa-output/pdfs rae-qa-output/screenshots
          cat > /tmp/rae-qa.cjs <<'JAVASCRIPT'
          (async () => {
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs');
          const out = 'rae-qa-output';
          const jobs = [];
          const context=JSON.parse(fs.readFileSync('job-context-data.json','utf8'));
          const byUrl=new Map(context.entries.filter(e=>e.id&&e.url).map(e=>[e.url.replace(/\/$/,''),e]));
          const slug=t=>String(t).normalize('NFKD').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,105);
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const results={capturedAt:new Date().toISOString(),site:{},postings:[]};
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          page.on('pageerror',e=>(results.site.errors??=[]).push(String(e).slice(0,400)));
          try{
            const resp=await page.goto('https://chiningchang.github.io/rae-job-opportunities/index.html',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(4000);
            results.site.http=resp?.status();
            results.site.title=await page.title();
            results.site.activeRows=await page.locator('#jobs tr').count();
            results.site.newTitles=await page.locator('#jobs tr').allTextContents();
            results.site.newTitles=results.site.newTitles.slice(0,7).map(x=>x.slice(0,180));
            results.site.links=await page.locator('#jobs tr a[href]').count();
            const activeRows=await page.locator('#jobs tr').evaluateAll(rows=>rows.map(row=>({isLatest:!!row.querySelector('.new-badge'),url:row.querySelector('a.btn')?.href||'',institution:row.cells[2]?.innerText?.trim()||''})));
            results.site.latestCount=activeRows.filter(row=>row.isLatest).length;
            const latest=activeRows.filter(row=>row.isLatest);
            for(const row of latest){
              const match=byUrl.get(row.url.replace(/\/$/,''));
              if(match)jobs.push([match.id,slug(match.position),row.url]);
              else (results.site.unmatchedLatestUrls??=[]).push(row.url);
            }
            results.site.captureTargets=jobs.length;
            const queryInstitution=activeRows[0]?.institution||'';

            await page.screenshot({path:out+'/screenshots/active.png',fullPage:true});
            await page.locator('#q').fill(queryInstitution);
            await page.waitForTimeout(700);
            results.site.searchRows=await page.locator('#jobs tr').count();
            results.site.searchText=(await page.locator('#jobs').innerText()).slice(0,450);
            await page.locator('#q').fill('');
            await page.locator('#rank').selectOption({index:1});
            await page.waitForTimeout(500);
            results.site.rankFilterRows=await page.locator('#jobs tr').count();
            await page.locator('#rank').selectOption('');
            await page.locator('#archiveTab').click();
            results.site.archiveRows=await page.locator('#jobs tr').count();
            await page.locator('#activeTab').click();
            results.site.returnActiveRows=await page.locator('#jobs tr').count();
            await page.goto('https://chiningchang.github.io/rae-job-opportunities/insights.html',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(4500);
            results.site.insightsTitle=await page.title();
            results.site.insightsBodyLength=(await page.locator('body').innerText()).length;
            await page.screenshot({path:out+'/screenshots/insights.png',fullPage:true});
            results.site.passed=results.site.http===200&&results.site.activeRows>0&&results.site.searchRows>0&&results.site.searchRows<=results.site.activeRows&&results.site.archiveRows>=0&&results.site.returnActiveRows===results.site.activeRows&&results.site.insightsBodyLength>300&&!(results.site.errors?.length);
          }catch(e){results.site.error=String(e)}
          await page.close();
          for(const [id,slug,url] of jobs){
            const p=await browser.newPage({viewport:{width:1280,height:1000}});
            let result={id,url};
            try{
              const response=await p.goto(url,{waitUntil:'domcontentloaded',timeout:35000});
              await p.waitForTimeout(2000);
              // Dismiss consent overlays before printing so the PDF preserves readable job text.
              for(const frame of p.frames()){
                try{
                  const reject=frame.getByRole('button',{name:'Reject',exact:true});
                  if(await reject.count()){await reject.first().click({timeout:3000});await p.waitForTimeout(500);break}
                }catch(e){}
              }
              const text=await p.locator('body').innerText({timeout:15000});
              result.http=response?.status();result.title=await p.title();result.textLength=text.length;
              result.blocked=/access denied|captcha|enable javascript|403 forbidden|cloudflare|robot check/i.test(text.slice(0,1000))||result.http>=400;
              result.sufficient=text.length>1100&&!result.blocked;
              if(result.sufficient){
                const filename=id+'_'+slug+'_Original-Webpage-Capture.pdf';
                await p.pdf({path:out+'/pdfs/'+filename,format:'A4',printBackground:true,preferCSSPageSize:true,timeout:30000});
                result.pdf=filename;
                result.pdfBytes=fs.statSync(out+'/pdfs/'+filename).size;
              }else{result.reason='Page blocked, missing content, or insufficient visible text'}
            }catch(e){result.error=String(e)}
            results.postings.push(result);
            await p.close();
          }
          const delta=await browser.newPage();
          try{let res=await delta.goto('https://jobs.chronicle.com/job/38001675/assistant-professor-of-leadership-and-research/',{waitUntil:'domcontentloaded',timeout:35000});let t=await delta.locator('body').innerText();results.deltaState={http:res?.status(),title:await delta.title(),textLength:t.length,firstText:t.slice(0,500)}}catch(e){results.deltaState={error:String(e)}}
          await delta.close();
          await browser.close();
          fs.writeFileSync(out+'/qa-report.json',JSON.stringify(results,null,2));
          console.log('RAE_QA_REPORT='+JSON.stringify(results));
          })().catch(e=>{console.error(e);process.exitCode=1});
          JAVASCRIPT
          node /tmp/rae-qa.cjs
      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rae-qa-captures
          path: rae-qa-output/
          retention-days: 30
